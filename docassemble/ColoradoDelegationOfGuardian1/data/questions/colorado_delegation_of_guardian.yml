id: Colorado Delegation of Guardian intro
continue button field: colorado_delegation_of_guardian_intro
question: |
  Colorado Delegation of Guardian
subquestion: |
  ### Before you get started
  - Please note: this form allows a parent or legal guardian to temporarily delegate their authority and appoint an "Attorney in Fact" (another trusted person) to care for their minor child or incapacitated person.
  - Please carefully choose your "Attorney in Fact", who will be the caregiver.
  - Locate a notary for the form.

  ### When you are finished
  - Sign the document in front of a notary public.
  - Give copies to the named person and keep one for your records.

  Use this form if you are a parent or guardian who needs to temporarily delegate your power. It is important to make sure that the person you are naming is trustworthy and can handle the responsibilities.
